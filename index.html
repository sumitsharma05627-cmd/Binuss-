    <script>
      // Execute early to neutralize sandbox WebSocket errors
      (function() {
        if (typeof window === 'undefined') return;

        function DummyWebSocket(url, protocols) {
          this.url = url;
          this.protocols = protocols;
          this.readyState = 1;
          this.bufferedAmount = 0;
          this.extensions = '';
          this.protocol = Array.isArray(protocols) ? protocols[0] || '' : (protocols || '');
          this.binaryType = 'blob';

          var listeners = {};
          this.addEventListener = function(type, listener) {
            if (!listeners[type]) listeners[type] = [];
            listeners[type].push(listener);
          };
          this.removeEventListener = function(type, listener) {
            if (!listeners[type]) return;
            listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
          };
          this.dispatchEvent = function(event) {
            var list = listeners[event.type] || [];
            for (var i = 0; i < list.length; i++) {
              try { list[i].call(this, event); } catch (e) {}
            }
            var onHandler = this['on' + event.type];
            if (typeof onHandler === 'function') {
              try { onHandler.call(this, event); } catch (e) {}
            }
            return true;
          };
          this.send = function() {};
          this.close = function() {
            this.readyState = 3;
          };

          var self = this;
          setTimeout(function() {
            if (self.readyState === 1) {
              self.dispatchEvent({ type: 'open', target: self });
            }
          }, 0);
        }

        DummyWebSocket.CONNECTING = 0;
        DummyWebSocket.OPEN = 1;
        DummyWebSocket.CLOSING = 2;
        DummyWebSocket.CLOSED = 3;

        try {
          Object.defineProperty(window, 'WebSocket', {
            value: DummyWebSocket,
            writable: true,
            configurable: true
          });
        } catch (e) {
          window.WebSocket = DummyWebSocket;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return (a && a.message) ? a.message : String(a); }).join(' ');
          if (
            msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('WebSocket') !== -1 && msg.indexOf('failed') !== -1)
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason || e);
          var msg = (reason && reason.message) ? reason.message : String(reason);
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect') !== -1
          ) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && e.error.message)) ? (e.message || e.error.message) : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect') !== -1
          ) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
